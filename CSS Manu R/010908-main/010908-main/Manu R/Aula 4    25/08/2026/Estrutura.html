<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura html</title>
</head>
<body>
    <!-- O que é o Header O elemento <header> é utilizado dentro do corpo do documento HTML e representa o cabeçalho de uma página ou de uma seção específica. Ele pode conter títulos, subtítulos, logotipos, informações introdutórias e até elementos de navegação.  <header> pode ser inserido diretamente dentro do <body> ou dentro de elementos como <section> e <article>, dependendo da estrutura da página. (crtl;)-->
    <header>
        <h1>Olá Mundo!</h1>
    </header>

</body>
</html>
