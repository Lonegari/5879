<body>
        <!-- O que é header:O <header> pode ser inserido diretamente dentro do <body> ou dentro de elementos como <section> e <article>, dependendo da estrutura da página. Por ser um elemento semântico, ele exige tag de abertura <header> e tag de fechamento </header>, delimitando claramente o início e o fim do conteúdo do cabeçalho. -->
    <header>
        <h1>Manuzita</h1>
    </header>
